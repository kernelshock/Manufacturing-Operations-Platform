name: G7 Planning Contracts

on:
  push:
    branches:
      - feat/G7-materials-planning
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: g7-planning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g7-policy-contracts:
    runs-on: ubuntu-latest
    env:
      MOP_ENVIRONMENT: test
      MOP_DATABASE_URL: postgresql+psycopg://mop_test:mop_test@127.0.0.1:5432/mop_test
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_DB: mop_test
          POSTGRES_USER: mop_test
          POSTGRES_PASSWORD: mop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mop_test -d mop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install -c requirements-dev.lock.txt -e ".[dev]"
          python -m pip check
      - name: Validate source and single schema head
        run: |
          python -m compileall -q src/mop/planning tests/g7
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic upgrade head
          python -m alembic check
      - name: Run G7.1 synthetic policy and G0-G6 regression on disposable PostgreSQL
        run: python -m pytest tests/g0 tests/g1 tests/g2 tests/g3 tests/g4 tests/g5 tests/g6 tests/g7 -q
      - name: Verify security and source pins
        run: |
          ./infrastructure/scripts/repository-secret-scan.sh
          ./infrastructure/scripts/supply-chain-pin-check.sh
      - name: Confirm no G7 live migrations or purchase endpoints
        run: |
          test ! -e src/mop/api/v1/planning.py
          test ! -e migrations/versions/0034_g7_planning.py

  g7-gate:
    needs: [g7-policy-contracts]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "G7.1 read-only policy contracts and G0-G6 regression passed."
          echo "No G7 release, FAIC production deployment or automatic purchases authorized."
