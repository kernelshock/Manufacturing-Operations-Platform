name: G6 Materials

on:
  push:
    branches:
      - feat/G6-materials
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: g6-materials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g6-domain:
    runs-on: ubuntu-latest
    env:
      MOP_ENVIRONMENT: test
      MOP_DATABASE_URL: postgresql+psycopg://mop_test:mop_test@127.0.0.1:5432/mop_test
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_DB: mop_test
          POSTGRES_USER: mop_test
          POSTGRES_PASSWORD: mop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mop_test -d mop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock.txt
            requirements-prod.lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock.txt -e ".[dev]"
          python -m pip check
      - name: Compile Materials, Prolowin and versioned API
        run: python -m compileall -q src/mop/materials src/mop/prolowin src/mop/api/v1
      - name: Verify G6 migration and schema
        run: |
          python -m alembic heads | tee /tmp/g6-heads
          test "$(grep -c '(head)' /tmp/g6-heads)" -eq 1
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Run G6 materials contracts and PostgreSQL ledger tests
        run: python -m pytest tests/g6 -q
      - name: Verify tracked secrets and supply-chain pins
        run: |
          ./infrastructure/scripts/repository-secret-scan.sh
          ./infrastructure/scripts/supply-chain-pin-check.sh

  g6-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-fund
      - name: Typecheck G6.7 frontend
        run: npm run typecheck
      - name: Test G6.7 and frontend regressions
        run: npm test
      - name: Build frontend
        run: npm run build

  g6-gate:
    runs-on: ubuntu-latest
    needs: [g6-domain, g6-frontend]
    steps:
      - run: |
          echo "G6.1–G6.7 domain, API, PostgreSQL and frontend contracts passed."
          echo "G6 remains IN PROGRESS; CI uses only disposable test inventory and no production data."
          echo "This workflow does not authorize release or production deployment."
