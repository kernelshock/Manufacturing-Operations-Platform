name: G6 Materials

on:
  push:
    branches:
      - feat/G6-materials
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: g6-materials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g6-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock.txt
            requirements-prod.lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock.txt -e ".[dev]"
          python -m pip check
      - name: Compile Materials domain
        run: python -m compileall -q src/mop/materials
      - name: Run G6 materials contracts
        run: python -m pytest tests/g6 -q
      - name: Verify tracked secrets and supply-chain pins
        run: |
          ./infrastructure/scripts/repository-secret-scan.sh
          ./infrastructure/scripts/supply-chain-pin-check.sh

  g6-gate:
    runs-on: ubuntu-latest
    needs: [g6-domain]
    steps:
      - run: |
          echo "G6.1 domain contracts passed."
          echo "G6 remains IN PROGRESS and no stock movements are posted."
          echo "This workflow does not authorize release or production deployment."
