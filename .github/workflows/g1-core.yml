name: G1 Platform Core

on:
  push:
    branches:
      - feat/G1-platform-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: g1-platform-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan tracked files for committed secrets
        run: ./infrastructure/scripts/repository-secret-scan.sh

  backend-baseline:
    runs-on: ubuntu-latest
    env:
      MOP_ENVIRONMENT: test
      MOP_DATABASE_URL: postgresql+psycopg://mop_test:mop_test@127.0.0.1:5432/mop_test

    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_DB: mop_test
          POSTGRES_USER: mop_test
          POSTGRES_PASSWORD: mop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mop_test -d mop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit==2.10.1
          python -m pip check

      - name: Audit Python dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Compile backend package
        run: python -m compileall -q src/mop

      - name: Apply database migrations from clean PostgreSQL
        run: python -m alembic upgrade head

      - name: Verify migration head
        run: python -m alembic current

      - name: Run G0 regression tests
        run: python -m pytest tests/g0 -q

      - name: Run G1 tests
        run: python -m pytest tests/g1 -q

      - name: Generate Python lock candidates
        run: |
          python -m venv /tmp/mop-prod-lock
          /tmp/mop-prod-lock/bin/python -m pip install --upgrade pip
          /tmp/mop-prod-lock/bin/python -m pip install .
          /tmp/mop-prod-lock/bin/python -m pip freeze --exclude-editable | sort > /tmp/requirements-prod.lock.txt

          python -m venv /tmp/mop-dev-lock
          /tmp/mop-dev-lock/bin/python -m pip install --upgrade pip
          /tmp/mop-dev-lock/bin/python -m pip install ".[dev]"
          /tmp/mop-dev-lock/bin/python -m pip freeze --exclude-editable | sort > /tmp/requirements-dev.lock.txt

      - name: Upload Python lock candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g1-python-lock-candidates
          path: |
            /tmp/requirements-prod.lock.txt
            /tmp/requirements-dev.lock.txt
          if-no-files-found: error

  frontend-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"

      - name: Install frontend dependencies
        run: npm install --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend lock candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g1-frontend-lock-candidate
          path: frontend/package-lock.json
          if-no-files-found: error

  promote-locks:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    needs:
      - backend-baseline
      - frontend-shell
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"

      - name: Generate lockfiles
        run: |
          python -m venv /tmp/mop-prod-lock
          /tmp/mop-prod-lock/bin/python -m pip install --upgrade pip
          /tmp/mop-prod-lock/bin/python -m pip install .
          /tmp/mop-prod-lock/bin/python -m pip freeze --exclude-editable | sort | grep -v '^faic-mop @' > requirements-prod.lock.txt

          python -m venv /tmp/mop-dev-lock
          /tmp/mop-dev-lock/bin/python -m pip install --upgrade pip
          /tmp/mop-dev-lock/bin/python -m pip install ".[dev]"
          /tmp/mop-dev-lock/bin/python -m pip freeze --exclude-editable | sort | grep -v '^faic-mop @' > requirements-dev.lock.txt

          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit validated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-prod.lock.txt requirements-dev.lock.txt frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "G1.8: promote validated dependency lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  runtime-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-baseline
      - frontend-shell
      - hardening-baseline
    env:
      MOP_WEB_HOST_PORT: "18080"
      MOP_ADMIN_USERNAME: smoke-admin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate ephemeral runtime secrets
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(f"MOP_POSTGRES_PASSWORD={secrets.token_urlsafe(32)}\n")
              target.write(f"MOP_BOOTSTRAP_ADMIN_PASSWORD={secrets.token_urlsafe(32)}\n")
          PY

      - name: Show Docker Compose version
        run: docker compose version

      - name: Create ephemeral runtime configuration
        run: |
          cat > .env.runtime-ci <<EOF
          MOP_ENVIRONMENT=test
          MOP_POSTGRES_DB=mop_smoke
          MOP_POSTGRES_USER=mop_smoke
          MOP_POSTGRES_PASSWORD=${MOP_POSTGRES_PASSWORD}
          MOP_WEB_HOST_PORT=18080
          MOP_SESSION_TTL_MINUTES=30
          MOP_SESSION_COOKIE_SECURE=false
          MOP_LOGIN_MAX_FAILURES=5
          MOP_LOGIN_LOCKOUT_MINUTES=15
          MOP_ADMIN_USERNAME=smoke-admin
          MOP_ADMIN_DISPLAY_NAME=MOP Smoke Administrator
          EOF

      - name: Run full runtime smoke test
        run: ./infrastructure/scripts/runtime-smoke.sh .env.runtime-ci

  g1-gate:
    runs-on: ubuntu-latest
    needs:
      - hardening-baseline
      - backend-baseline
      - frontend-shell
      - runtime-smoke
    steps:
      - name: Confirm G1 hardening gate
        run: echo "G1 hardening baseline passed."
