name: G1 Platform Core

on:
  push:
    branches:
      - feat/G1-platform-core
  pull_request:
    branches:
      - main

jobs:
  backend-baseline:
    runs-on: ubuntu-latest
    env:
      MOP_ENVIRONMENT: test
      MOP_DATABASE_URL: postgresql+psycopg://mop_test:mop_test@127.0.0.1:5432/mop_test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mop_test
          POSTGRES_USER: mop_test
          POSTGRES_PASSWORD: mop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mop_test -d mop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile backend package
        run: python -m compileall -q src/mop

      - name: Apply database migrations from clean PostgreSQL
        run: python -m alembic upgrade head

      - name: Verify migration head
        run: python -m alembic current

      - name: Run G0 regression tests
        run: python -m pytest tests/g0 -q

      - name: Run G1 tests
        run: python -m pytest tests/g1 -q

  frontend-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "26.13.0"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  runtime-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-baseline
      - frontend-shell
    env:
      MOP_WEB_HOST_PORT: "18080"
      MOP_ADMIN_USERNAME: smoke-admin
      MOP_BOOTSTRAP_ADMIN_PASSWORD: "G1-Smoke-Admin-2026!"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Docker Compose version
        run: docker compose version

      - name: Create ephemeral runtime configuration
        run: |
          cat > .env.runtime-ci <<'EOF'
          MOP_ENVIRONMENT=test
          MOP_POSTGRES_DB=mop_smoke
          MOP_POSTGRES_USER=mop_smoke
          MOP_POSTGRES_PASSWORD=Db@Smoke:2026!
          MOP_WEB_HOST_PORT=18080
          MOP_SESSION_TTL_MINUTES=30
          MOP_SESSION_COOKIE_SECURE=false
          MOP_ADMIN_USERNAME=smoke-admin
          MOP_ADMIN_DISPLAY_NAME=MOP Smoke Administrator
          EOF

      - name: Run full runtime smoke test
        run: ./infrastructure/scripts/runtime-smoke.sh .env.runtime-ci
