name: G1 Platform Core

on:
  push:
    branches:
      - feat/G1-platform-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: g1-platform-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan tracked files for committed secrets
        run: ./infrastructure/scripts/repository-secret-scan.sh

      - name: Verify supply-chain pins
        run: ./infrastructure/scripts/supply-chain-pin-check.sh

  backend-baseline:
    runs-on: ubuntu-latest
    env:
      MOP_ENVIRONMENT: test
      MOP_DATABASE_URL: postgresql+psycopg://mop_test:mop_test@127.0.0.1:5432/mop_test

    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_DB: mop_test
          POSTGRES_USER: mop_test
          POSTGRES_PASSWORD: mop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mop_test -d mop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock.txt
            requirements-prod.lock.txt

      - name: Install constrained development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock.txt -e ".[dev]"
          python -m pip check

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --local --skip-editable

      - name: Verify production lock resolves
        run: |
          python -m venv /tmp/mop-prod-verify
          /tmp/mop-prod-verify/bin/python -m pip install --upgrade pip
          /tmp/mop-prod-verify/bin/python -m pip install -c requirements-prod.lock.txt .
          /tmp/mop-prod-verify/bin/python -m pip check

      - name: Compile backend package
        run: python -m compileall -q src/mop

      - name: Apply database migrations from clean PostgreSQL
        run: python -m alembic upgrade head

      - name: Verify migration head
        run: python -m alembic current

      - name: Run G0 regression tests
        run: python -m pytest tests/g0 -q

      - name: Run G1 tests
        run: python -m pytest tests/g1 -q

  frontend-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  runtime-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-baseline
      - frontend-shell
      - hardening-baseline
    env:
      MOP_WEB_HOST_PORT: "18080"
      MOP_ADMIN_USERNAME: smoke-admin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate ephemeral runtime secrets
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(f"MOP_POSTGRES_PASSWORD={secrets.token_urlsafe(32)}\n")
              target.write(f"MOP_BOOTSTRAP_ADMIN_PASSWORD={secrets.token_urlsafe(32)}\n")
          PY

      - name: Show Docker Compose version
        run: docker compose version

      - name: Create ephemeral runtime configuration
        run: |
          cat > .env.runtime-ci <<EOF
          MOP_ENVIRONMENT=test
          MOP_POSTGRES_DB=mop_smoke
          MOP_POSTGRES_USER=mop_smoke
          MOP_POSTGRES_PASSWORD=${MOP_POSTGRES_PASSWORD}
          MOP_WEB_HOST_PORT=18080
          MOP_SESSION_TTL_MINUTES=30
          MOP_SESSION_COOKIE_SECURE=false
          MOP_LOGIN_MAX_FAILURES=5
          MOP_LOGIN_LOCKOUT_MINUTES=15
          MOP_ADMIN_USERNAME=smoke-admin
          MOP_ADMIN_DISPLAY_NAME=MOP Smoke Administrator
          EOF

      - name: Run full runtime smoke test
        run: ./infrastructure/scripts/runtime-smoke.sh .env.runtime-ci

  g1-gate:
    runs-on: ubuntu-latest
    needs:
      - hardening-baseline
      - backend-baseline
      - frontend-shell
      - runtime-smoke
    steps:
      - name: Confirm G1 hardening gate
        run: echo "G1 hardening baseline passed."
