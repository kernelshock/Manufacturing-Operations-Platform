[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "faic-mop"
version = "2.0.0.dev1"
description = "Manufacturing Operations Platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162.0,<0.163.0",
  "pydantic-settings>=2.16.1,<3.0.0",
  "uvicorn[standard]>=0.54.0,<0.55.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=9.1.1,<10.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mop*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
